<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#D4A017">
<title>لا يوجد اتصال — Gold ERP Pro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background:
      radial-gradient(1000px 500px at 20% 0%,#1e293b 0%,transparent 55%),
      radial-gradient(900px 500px at 100% 100%,#0f172a 0%,transparent 55%),
      #080d18;
    font-family: 'Cairo', system-ui, sans-serif;
    color: #e8eefb;
    text-align: center;
  }
  .box {
    max-width: 420px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 40px 32px;
  }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg,#F0D68C 0%,#D4A017 48%,#9C7726 100%);
    display: grid;
    place-items: center;
    margin: 0 auto 20px;
    color: #2a1f05;
    font-size: 34px;
    font-weight: 900;
  }
  h1 {
    font-size: 20px;
    font-weight: 900;
    margin: 0 0 10px;
    letter-spacing: -.3px;
  }
  p {
    font-size: 13px;
    color: #8f9dba;
    line-height: 1.7;
    margin: 0 0 24px;
    font-weight: 600;
  }
  button {
    background: linear-gradient(135deg,#F0D68C 0%,#D4A017 48%,#9C7726 100%);
    color: #2a1f05;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  button:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">Au</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>
      التطبيق يعمل بدون إنترنت — لكن لم نجد نسخة مخزَّنة بعد.
      <br>
      يرجى الاتصال بالإنترنت مرة واحدة على الأقل.
    </p>
    <button onclick="location.reload()">🔄 إعادة المحاولة</button>
  </div>
</body>
</html>
