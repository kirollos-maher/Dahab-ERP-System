<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مولّد أيقونات PWA — Gold ERP Pro</title>
<style>
  body {
    font-family: 'Cairo', system-ui, sans-serif;
    background: #121212;
    color: #e8eefb;
    padding: 40px;
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    color: #D4A017;
    font-weight: 900;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin: 30px 0;
  }
  .card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  canvas {
    background: #2a2a2a;
    border-radius: 12px;
    max-width: 100%;
  }
  .btn {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
    background: #D4A017;
    color: #121212;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 800;
    cursor: pointer;
    border: none;
    font-size: 14px;
  }
  .btn:hover { background: #F0D68C; }
  .info {
    background: #1e2a1e;
    border: 1px solid #2d4a2d;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 30px;
    color: #a8dfa8;
  }
  code {
    background: #0a0a0a;
    padding: 2px 8px;
    border-radius: 4px;
    color: #D4A017;
    font-family: monospace;
  }
</style>
</head>
<body>

<h1>🎨 مولّد أيقونات PWA</h1>

<div class="info">
  <strong>📖 كيف تستخدم هذا الملف؟</strong><br>
  1. افتحه في المتصفح<br>
  2. اضغط على زر "تحميل PNG" أسفل كل أيقونة<br>
  3. احفظ الملفات في مجلد <code>icons/</code><br>
  4. الأسماء المطلوبة: <code>icon-192.png</code>, <code>icon-512.png</code>,
     <code>icon-maskable-512.png</code>, <code>apple-touch-icon.png</code>
</div>

<div class="grid">
  <div class="card">
    <h3>192×192</h3>
    <canvas id="c192" width="192" height="192"></canvas>
    <button class="btn" onclick="download('c192','icon-192.png')">📥 تحميل</button>
  </div>

  <div class="card">
    <h3>512×512</h3>
    <canvas id="c512" width="512" height="512"></canvas>
    <button class="btn" onclick="download('c512','icon-512.png')">📥 تحميل</button>
  </div>

  <div class="card">
    <h3>Maskable 512×512</h3>
    <canvas id="cm512" width="512" height="512"></canvas>
    <button class="btn" onclick="download('cm512','icon-maskable-512.png')">📥 تحميل</button>
  </div>

  <div class="card">
    <h3>iOS Touch 180×180</h3>
    <canvas id="c180" width="180" height="180"></canvas>
    <button class="btn" onclick="download('c180','apple-touch-icon.png')">📥 تحميل</button>
  </div>
</div>

<script>
function drawIcon(canvas, options = {}) {
  const { maskable = false } = options;
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const r = size / 2;

  // Background
  ctx.fillStyle = '#121212';
  if (!maskable) {
    // Rounded corners for regular icons
    roundRect(ctx, 0, 0, size, size, size * 0.22);
    ctx.fill();
  } else {
    ctx.fillRect(0, 0, size, size);
  }

  // Gold circle
  const circleR = maskable ? r * 0.6 : r * 0.75;
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#F0D68C');
  grad.addColorStop(0.5, '#D4A017');
  grad.addColorStop(1, '#9C7726');

  ctx.beginPath();
  ctx.arc(r, r, circleR, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Shine
  const shine = ctx.createLinearGradient(0, r - circleR, 0, r + circleR);
  shine.addColorStop(0, 'rgba(255,255,255,0.35)');
  shine.addColorStop(0.6, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(r, r, circleR, 0, Math.PI * 2);
  ctx.fillStyle = shine;
  ctx.fill();

  // Au text
  ctx.fillStyle = '#2A1F05';
  ctx.font = `900 ${circleR * 1.05}px "Cairo", "Arial", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Au', r, r + circleR * 0.08);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = filename;
  a.click();
}

// Generate all on load
document.fonts.ready.then(() => {
  drawIcon(document.getElementById('c192'), { maskable: false });
  drawIcon(document.getElementById('c512'), { maskable: false });
  drawIcon(document.getElementById('cm512'), { maskable: true });
  drawIcon(document.getElementById('c180'), { maskable: false });
});
</script>
</body>
</html>
